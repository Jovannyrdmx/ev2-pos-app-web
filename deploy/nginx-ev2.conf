# Instalar como /etc/nginx/sites-available/ev2-pos-app-web
# Reemplaza ev2.system por tu dominio real si cambia.
server { listen 80; server_name app.ev2.system; location / { proxy_pass http://127.0.0.1:8080; proxy_set_header Host $host; } }
server { listen 80; server_name pos.ev2.system; location / { proxy_pass http://127.0.0.1:8081; proxy_set_header Host $host; } }
server { listen 80; server_name api.ev2.system; client_max_body_size 10m; location / { proxy_pass http://127.0.0.1:3000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; proxy_set_header X-Forwarded-Proto $scheme; } }
